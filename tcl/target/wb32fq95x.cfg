#
# OpenOCD target configuration for Westberry WB32FQ95xx microcontrollers
#
# Copyright (C) 2026 Eric Molitor github.com/emolitor
#
# This is the target-only configuration. Use with an interface config:
#   openocd -f interface/cmsis-dap.cfg -f target/wb32fq95x.cfg
#
# Supported devices:
#   WB32FQ95xC - 128-256 KB Flash, 12-36 KB SRAM
#
# Device specifications:
#   Flash: 0x08000000
#   SRAM:  0x20000000
#   Core:  ARM Cortex-M3 r2p0
#   SYS_ID: 0x3Axxxxxx (at 0x40016400)
#

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME wb32fq95x
}

set _ENDIAN little

# Work-area in RAM for flash programming
# Use 16KB (safe for all variants)
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x4000
}

# Flash size - override for smaller variants
# 0x40000 = 256KB (WB32FQ95xC)
# 0x20000 = 128KB
if { [info exists FLASH_SIZE] } {
    set _FLASH_SIZE $FLASH_SIZE
} else {
    set _FLASH_SIZE 0x40000
}

# SWD TAP ID - WB32FQ95x uses 0x2ba01477 (Cortex-M3 r2p0)
if { [info exists CPUTAPID] } {
   set _CPUTAPID $CPUTAPID
} else {
   set _CPUTAPID 0x2ba01477
}

# Create the DAP
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# Flash bank configuration using custom WB32F10x driver
# The driver auto-detects flash size from SYS_MEMSZ register
# Note: The same wb32f10x driver supports both WB32F10x and WB32FQ95xx families
flash bank $_CHIPNAME.flash wb32f10x 0x08000000 0 0 0 $_TARGETNAME

# Adapter speed - start at 1MHz, increase after connection
adapter speed 1000

# Reset configuration
adapter srst delay 100
reset_config srst_nogate

# Use SYSRESETREQ for soft reset
cortex_m reset_config sysresetreq

#
# WB32FQ95xx Register Definitions
#
set WB32_RCC_BASE       0x40010C00
set WB32_FMC_BASE       0x40017800
set WB32_SYS_BASE       0x40016400

#
# Helper Commands
#

proc wb32_info {} {
    set sys_id [mrw 0x40016400]
    set sys_memsz [mrw 0x40016404]

    # Extract SRAM size from bits [5:4]
    set sram_code [expr {($sys_memsz >> 4) & 0x03}]
    switch $sram_code {
        0 { set sram_kb 36 }
        1 { set sram_kb 28 }
        2 { set sram_kb 20 }
        3 { set sram_kb 12 }
    }

    # Extract flash size from bits [3:0]
    # Note: The driver auto-detects flash size from SYS_MEMSZ
    # Values may vary by device variant
    set flash_code [expr {$sys_memsz & 0x0F}]
    switch $flash_code {
        0 { set flash_kb 256 }
        1 { set flash_kb 128 }
        3 { set flash_kb 256 }
        default { set flash_kb "? (code=$flash_code)" }
    }

    echo "WB32FQ95xx Device Information:"
    echo "  SYS_ID:      0x[format %08x $sys_id]"
    echo "  SYS_MEMSZ:   0x[format %08x $sys_memsz]"
    echo "  Flash:       $flash_kb KB at 0x08000000"
    echo "  SRAM:        $sram_kb KB at 0x20000000"
    echo "  Core:        ARM Cortex-M3"
}

proc wb32_dump_flash {filename {length 0x1000}} {
    echo "Dumping $length bytes of flash to $filename..."
    dump_image $filename 0x08000000 $length
    echo "Done."
}

proc wb32_dump_all_flash {filename} {
    global _FLASH_SIZE
    echo "Dumping entire flash ($_FLASH_SIZE bytes) to $filename..."
    dump_image $filename 0x08000000 $_FLASH_SIZE
    echo "Done."
}

proc wb32_verify_flash {filename} {
    echo "Verifying flash against $filename..."
    verify_image $filename 0x08000000
    echo "Done."
}

proc wb32_load_ram {filename {address 0x20000000}} {
    echo "Loading $filename to RAM at $address..."
    load_image $filename $address
    echo "Done."
}

# Increase speed after successful reset
$_TARGETNAME configure -event reset-init {
    adapter speed 4000
}
